# Personal fork: frontend tests with failures as annotations (readable without the full log).
name: My tests
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: frontend
        run: |
          npm ci
          npx vitest run --reporter=github-actions --reporter=dot
